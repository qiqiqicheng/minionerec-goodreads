_target_: minionerec_goodreads.models.rl.RLModule

pretrained_model_name_or_path: ${data.pretrained_model_name_or_path}
sft_export_dir: ${data.sft_export_dir}
sid_index_path: ${data.sid_index_path}
max_length: 1024
num_generations: 4
logprob_micro_batch_size: 4
optimizer_accumulate_batches: 8
rollout_backend: "hf"
vllm_gpu_memory_utilization: 0.30
vllm_enable_prefix_caching: True
vllm_max_lora_rank: 16
rank_reward_lambda: 0.1
use_partial_match_reward: True
partial_match_lambda: 0.2
use_long_tail_reward: False
long_tail_reward_lambda: 0.05
popularity_train_path: ${data.train_path}
kl_beta: 0.02
clip_epsilon: 0.2
warmup_ratio: 0.03
gradient_checkpointing: True
torch_dtype: "bfloat16"
load_in_4bit: True
load_in_8bit: False
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: True
max_sid_length: null
attn_implementation: "sdpa"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  _target_: transformers.get_cosine_schedule_with_warmup
  _partial_: true

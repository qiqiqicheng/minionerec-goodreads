# @package _global_

data:
  batch_size: 512

model:
  optimizer:
    lr: 0.001
  rqvae:
    in_dim: 2560
    layers: [1024, 512, 256]
    emb_dim: 64
    rq:
      _target_: minionerec_goodreads.models.rqvae.ResidualVectorQuantizer
      emb_dim: ${model.rqvae.emb_dim}
      loss_beta: 0.25
      codebook_size_list: [128, 128, 256, 256]
      kmeans_init: true
      kmeans_iters: 20
      kmeans_seed: ${seed}
      sk_temp: 0.01
      sk_iters: 100

logger:
  wandb:
    group: "rqvae"
    tags: ["train", "rqvae", "4_levels"]
    notes: "RQ-VAE with 4 levels of quantization, codebook sizes [128, 128, 256, 256]."
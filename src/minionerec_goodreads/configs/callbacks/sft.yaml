defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - learning_rate_monitor
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/loss_recommendation"
  mode: "min"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/loss_recommendation"
  patience: 5
  mode: "min"

recommendation_validation:
  _target_: minionerec_goodreads.callbacks.sft.SFTRecommendationValidationCallback
  num_samples: 256
  num_beams: 10
  ks: [3, 5, 10]
  task: "seq_sid_to_sid"
  seed: ${seed}

model_summary:
  max_depth: -1
